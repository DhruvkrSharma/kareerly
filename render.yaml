services:
  - type: web
    name: kareerly-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      # Supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      
      # Groq
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      
      # Embeddings
      - key: EMBEDDING_MODEL
        value: sentence-transformers/all-MiniLM-L6-v2
      
      # Browserless
      - key: BROWSERLESS_API_KEY
        sync: false
      
      # App Settings
      - key: PORT
        value: "8000"
      - key: ENVIRONMENT
        value: production
